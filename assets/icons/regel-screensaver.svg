<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="centerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#glowBorder)" stroke-width="8" />

  <!-- Ambient Glow Core -->
  <circle cx="256" cy="256" r="180" fill="url(#centerCore)" />

  <!-- Harmonic Resonance Lattice Strings -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2">
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="142" y1="142" x2="370" y2="370" />
    <line x1="370" y1="142" x2="142" y2="370" />
    <circle cx="256" cy="256" r="70" fill="none" stroke-dasharray="6,6" />
    <circle cx="256" cy="256" r="130" fill="none" stroke-dasharray="8,8" />
  </g>

  <!-- Dynamic Cymatics Sine Waves -->
  <path d="M 80,280 C 130,210 170,350 220,270 C 270,190 310,340 370,250 C 410,190 430,220 440,240"
        fill="none" stroke="url(#wave1)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />

  <path d="M 72,240 C 120,330 180,180 240,290 C 290,370 350,190 400,280 C 424,315 436,290 444,275"
        fill="none" stroke="url(#wave2)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Dewdrop / Singularity Particle Orbs -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#glow)" />
  <circle cx="220" cy="270" r="7" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="370" cy="250" r="8" fill="#ec4899" filter="url(#glow)" />
  <circle cx="170" cy="200" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="330" cy="320" r="6" fill="#a855f7" filter="url(#glow)" />
  <circle cx="290" cy="180" r="5" fill="#facc15" filter="url(#glow)" />
</svg>
